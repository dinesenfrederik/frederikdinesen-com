name: Content engine

# Scans trends, picks a topic, researches it (Gemini) and writes DA + EN drafts (Claude),
# then opens a pull request. Vercel builds a preview of the PR; merging publishes.

on:
  schedule:
    # Mondays and Thursdays at 05:17 UTC (06:17 / 07:17 Danish time): two drafts a week.
    - cron: '17 5 * * 1,4'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Optional: write about exactly this topic (skips the trend scan)'
        required: false
        default: ''
      count:
        description: 'Number of articles to draft'
        required: false
        default: '1'
      scan_only:
        description: 'Only scan and score topic ideas (no article, no PR)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: content-engine
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: content-engine
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: content-engine/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Load previous drafts (open, merged and rejected PRs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .out
          gh pr list --label content-engine --state all --limit 200 --json title,state > .out/pr-history.json || echo '[]' > .out/pr-history.json

      - name: Run content engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          FORCED_TOPIC: ${{ inputs.topic }}
          ARTICLE_COUNT: ${{ inputs.count || '1' }}
          SCAN_ONLY: ${{ inputs.scan_only && 'true' || 'false' }}
        run: |
          if [ "$SCAN_ONLY" = "true" ]; then
            node src/run.mjs --scan-only
          else
            node src/run.mjs
          fi

      - name: Job summary
        if: always()
        run: cat .out/summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Open pull request
        if: ${{ !inputs.scan_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test -f .out/branch.txt || { echo "No draft produced"; exit 1; }
          branch="$(cat .out/branch.txt)"
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add content/blog sitemap.xml content-engine/data
          git commit -m "$(cat content-engine/.out/pr-title.txt)"
          git push -u origin "$branch"
          gh label create content-engine --color B45309 --description "Drafts from the content engine" 2>/dev/null || true
          url="$(gh pr create \
            --title "$(cat content-engine/.out/pr-title.txt)" \
            --body-file content-engine/.out/pr-body.md \
            --label content-engine)"
          echo "Opened $url" | tee -a "$GITHUB_STEP_SUMMARY"
          # Request a review so GitHub notifies you (best effort).
          gh pr edit "$url" --add-reviewer "$REVIEWER" || true
